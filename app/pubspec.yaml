name: morning_routine
description: Android 우선 수면 및 아침 루틴 관리 앱.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geocoding: ^5.0.1
  geolocator: ^14.1.2
  latlong2: ^0.10.1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
